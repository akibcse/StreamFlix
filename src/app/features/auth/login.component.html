<div class="auth-card">
  <div class="auth-header">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to your StreamFlix account</p>
  </div>

  <div class="alert alert-warning" *ngIf="accessDeniedNotice()">
    ⚠️ Admin privileges required to access the dashboard.
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage()">
    {{ errorMessage() }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input
        id="email"
        type="email"
        class="form-input"
        formControlName="email"
        placeholder="name@example.com"
        autocomplete="email"
      />
      <span
        class="input-error"
        *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']"
      >
        Email is required
      </span>
      <span
        class="input-error"
        *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']"
      >
        Please enter a valid email address
      </span>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input
        id="password"
        type="password"
        class="form-input"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <span
        class="input-error"
        *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']"
      >
        Password is required
      </span>
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading()">
      <span *ngIf="!loading()">Sign In</span>
      <span *ngIf="loading()">Signing in...</span>
    </button>
  </form>

  <div class="divider">
    <span>Or continue with</span>
  </div>

  <button type="button" class="btn-google" (click)="onGoogleSignIn()" [disabled]="loading()">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path
        fill="#EA4335"
        d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"
      />
      <path
        fill="#4285F4"
        d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.9z"
      />
      <path
        fill="#FBBC05"
        d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"
      />
      <path
        fill="#34A853"
        d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"
      />
    </svg>
    Sign in with Google
  </button>

  <div class="auth-footer">
    Don't have an account?
    <a routerLink="/register" class="auth-link">Create Account</a>
  </div>
</div>
